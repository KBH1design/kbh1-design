# Static site: no build step, publish the repository root.
[build]
  publish = "."
  command = ""

# Browsers check for newer images and CSS on each visit, so a replaced file
# shows up at once even when it keeps its name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
